<head>

<title>Técnica Dietética — Revisão</title>

<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#e4e7ec;--acc:#0e8f7e;--onacc:#fff;--bad:#d64550;--ok:#2f9e63;--soft:#e8f5f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--card:#171d25;--ink:#e8edf2;--mute:#94a0b0;--line:#252d38;--acc:#3ccbb5;--onacc:#0f1419;--bad:#f0808a;--ok:#5fd398;--soft:#15302c}}
:root[data-theme="dark"]{--bg:#0f1419;--card:#171d25;--ink:#e8edf2;--mute:#94a0b0;--line:#252d38;--acc:#3ccbb5;--onacc:#0f1419;--bad:#f0808a;--ok:#5fd398;--soft:#15302c}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0}
.in{max-width:720px;margin:0 auto;padding:0 18px}
header{padding:18px 0 4px}header h1{font-size:clamp(24px,6vw,32px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.tabs{display:flex;gap:8px;padding:10px 0}
.tabs button{flex:1;font:600 14px Figtree,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 6px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.view{display:none}.view.on{display:block}
h2{font-size:22px;margin:20px 0 8px}
p{margin:6px 0}
.intro{color:var(--mute);margin:16px 0 4px;font-size:15px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:8px 0;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--acc);outline:none}
.card div{flex:1}.card b{display:block;font-weight:600}
.card span{display:block;color:var(--mute);font-size:14px;line-height:1.4;margin-top:2px}
.card em{font-style:normal;color:var(--mute);font-size:20px}
.back{display:inline-block;margin:14px 0 0;font:600 14px Figtree,sans-serif;color:var(--acc);background:none;border:0;padding:4px 0;cursor:pointer}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.q>p{font-weight:600;margin-top:0}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--acc);background:var(--soft);border-radius:6px;padding:1px 8px;margin-bottom:4px}
.o{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin:6px 0;cursor:pointer}
.o:hover:enabled,.o:focus-visible{border-color:var(--acc);outline:none}
.vf{display:flex;gap:8px}.vf .o{text-align:center;margin:8px 0 0}
.right{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 18%,transparent)!important}
.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 18%,transparent)!important}
.fb{margin-top:8px;border-radius:8px;padding:8px 11px;font-size:15px;background:var(--soft)}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-left:4px solid var(--bad)}
.fb.good{border-left:4px solid var(--ok)}
.fb b{display:block}
textarea{width:100%;min-height:80px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.btn{font:600 14px Figtree,sans-serif;background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;margin:8px 8px 0 0}
.btn.out{background:none;color:var(--bad);border:1px solid var(--bad)}
#score{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 16px;width:max-content;max-width:100%;margin:14px auto 0;font-weight:600;font-size:14px}
.sum{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.leg{flex:1;min-width:160px}.leg div{margin:4px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bar{margin:12px 0}.bl{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bl span:last-child{color:var(--mute);text-align:right}
.tr{height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:4px}
.tr.has{background:color-mix(in srgb,var(--bad) 30%,transparent)}.fl{height:100%;background:var(--ok)}
.rng{display:flex;gap:6px;margin:6px 0}
.chip{font:600 13px Figtree,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.days{display:flex;gap:6px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.dc{flex:1 0 38px;text-align:center;font-size:12px}
.dp{height:18px;font-weight:600;font-size:12px}
.db{height:110px;border-radius:6px;overflow:hidden;background:var(--line);display:flex;flex-direction:column}
.de{background:var(--bad)}.dk{background:var(--ok)}
.dl{margin-top:4px;color:var(--mute)}.dn{height:16px;color:var(--mute)}
.lg{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;padding:0;margin:4px 0;cursor:pointer}
.lg u{color:var(--acc);font-size:13px;margin-left:4px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.dc{cursor:pointer}
.note{color:var(--mute);font-size:13px;margin:6px 0}
ul.w{padding-left:20px;margin:6px 0}ul.w li{margin:4px 0;font-size:15px}
footer{padding:26px 0 60px;color:var(--mute);font-size:14px}
</style>

<script>
var MC=[
{t:"Contaminação cruzada e higiene",q:"Um manipulador cortou filés de frango cru com uma faca e uma tábua e, sem higienizá-las, usou os mesmos utensílios para cortar tomates que serão servidos crus. Qual alternativa está correta?",
o:["O procedimento é seguro, pois o tomate possui alta quantidade de água livre.","A contaminação pode ser evitada apenas mantendo os tomates sob refrigeração.","Os utensílios devem ser devidamente higienizados antes de serem utilizados com alimentos que serão consumidos sem cocção.","Basta passar um pano seco sobre os utensílios antes de utilizá-los novamente.","O risco de contaminação existe somente quando o alimento apresenta alteração de cheiro ou aparência."],a:2,
e:["A água livre do tomate não impede a contaminação. A faca e a tábua levam microrganismos do frango cru para um alimento que não vai ser cozido.","A refrigeração só retarda a multiplicação dos microrganismos. Ela não os elimina nem impede que sejam transferidos.","Certo. Utensílios usados em alimento cru precisam ser higienizados antes de tocar alimentos consumidos sem cocção, porque nada vai eliminar os microrganismos depois.","Pano seco não remove nem inativa microrganismos. É preciso lavar e sanitizar.","Muitos microrganismos que causam doença não mudam cheiro nem aparência. O risco existe mesmo com o alimento aparentemente normal."]},
{t:"Fator de correção na compra",q:"Para uma preparação são necessários 2,4 kg de cenoura já limpa e pronta para o corte. O fator de correção é 1,20. Qual a quantidade aproximada a comprar?",
o:["1,8 kg","2,0 kg","2,4 kg","2,88 kg","3,20 kg"],a:3,
e:["Menor que 2,4 kg. Como há perdas na limpeza, o peso comprado (bruto) tem de ser maior que o peso limpo.","Também é menor que 2,4 kg. Com FC maior que 1, o bruto sempre é maior que o líquido.","2,4 kg é o peso já limpo (líquido). Falta somar as perdas do pré-preparo.","Certo. Peso bruto = peso líquido × FC = 2,4 × 1,20 = 2,88 kg.","Não corresponde ao cálculo. 2,4 × 1,20 dá 2,88 kg, não 3,20."]},
{t:"Índice de cocção",q:"400 g de arroz cru foram cozidos e, depois de pronto, pesaram 1.000 g. Qual o índice de cocção?",
o:["0,4","1,5","2,0","2,5","3,0"],a:3,
e:["Você inverteu a divisão (400 ÷ 1.000). O índice é peso cozido ÷ peso cru.","Não resulta de 1.000 ÷ 400.","IC 2,0 daria 800 g de arroz cozido, e o enunciado diz 1.000 g.","Certo. IC = peso cozido ÷ peso cru = 1.000 ÷ 400 = 2,5. O arroz ganhou peso por absorver água.","IC 3,0 daria 1.200 g de arroz cozido."]},
{t:"Planejamento de quantidade",q:"Uma escola vai oferecer porção de aproximadamente 120 g de arroz cozido para cada um dos 75 participantes. Qual quantidade de arroz cozido deve ser disponibilizada?",
o:["6 kg","7 kg","8 kg","9 kg","10 kg"],a:3,
e:["6 kg daria só 80 g por pessoa.","7 kg daria cerca de 93 g por pessoa.","8 kg daria cerca de 107 g por pessoa.","Certo. 120 g × 75 pessoas = 9.000 g = 9 kg.","10 kg daria cerca de 133 g por pessoa, mais que o planejado."]},
{t:"Higiene e indicadores na UAN",q:"Em uma UAN, o nutricionista viu rendimento diferente do planejado, perdas elevadas no preparo e falhas de higienização. Qual alternativa explica a importância da higiene e dos indicadores?",
o:["Esses conhecimentos servem apenas para definir o sabor das preparações.","Os indicadores são utilizados somente para determinar o valor nutricional dos alimentos.","A higiene e os indicadores auxiliam no controle da produção, na prevenção de contaminações, no planejamento de quantidades, na redução de desperdícios e no controle dos custos.","O fator de correção e o índice de cocção são utilizados exclusivamente em restaurantes comerciais.","Os procedimentos de higiene não interferem na qualidade das refeições quando os alimentos são mantidos refrigerados."],a:2,
e:["Higiene e indicadores não definem sabor. Eles tratam de segurança, rendimento e custo.","Indicadores como FC e IC não servem só para valor nutricional. Ajudam em quantidades, rendimento, perdas e custo.","Certo. É a alternativa que reúne tudo: controle da produção, prevenção de contaminação, planejamento, menos desperdício e controle de custos.","FC e IC são usados em qualquer serviço de alimentação, não só em restaurantes comerciais.","Refrigerar não substitui a higiene. Falhas de higienização comprometem a qualidade e a segurança, mesmo com refrigeração."]},
{t:"Divisão e união dos alimentos",q:"Qual alternativa apresenta uma operação de divisão seguida de uma operação de união?",
o:["Cortar uma cenoura em cubos e misturar os ingredientes de uma salada.","Bater claras em neve e peneirar a farinha.","Emulsionar um molho e triturar uma fruta.","Misturar os ingredientes de uma massa e cortar uma cebola.","Bater um creme e emulsionar um molho."],a:0,
e:["Certo. Cortar é divisão e misturar é união, nessa ordem. Divisão: cortar, triturar, peneirar. União: misturar, bater, emulsionar.","Bater é união e peneirar é divisão. A ordem está invertida.","Emulsionar é união e triturar é divisão. A ordem está invertida.","Misturar é união e cortar é divisão. A ordem está invertida.","Bater e emulsionar são as duas operações de união. Não há divisão."]},
{t:"Métodos de conservação",q:"Qual situação apresenta uma relação correta entre o método de conservação e sua finalidade?",
o:["O congelamento tem como objetivo retirar completamente a água dos alimentos.","A pasteurização consiste em submeter determinados alimentos ao calor controlado, destruindo todos os microrganismos patogênicos e aumentando sua conservação.","A desidratação aumenta a quantidade de água livre disponível no alimento.","A secagem é utilizada exclusivamente para alimentos de origem animal.","Os aditivos alimentares têm como única finalidade substituir o processo de refrigeração."],a:1,
e:["O congelamento não retira a água. Ele a transforma em gelo e retarda a multiplicação de microrganismos e as reações no alimento.","Certo. A pasteurização usa calor controlado para destruir os patogênicos e prolongar a conservação, como no leite.","A desidratação reduz a água livre, não aumenta. Menos água disponível dificulta o crescimento de microrganismos.","A secagem vale para vários alimentos, como frutas, grãos e carnes, e não só para os de origem animal.","Aditivos têm várias funções (como conservar ou evitar oxidação) e não existem só para substituir a refrigeração."]},
{t:"Açúcares e edulcorantes",q:"Sobre os ingredientes usados para adoçar preparações, qual alternativa está correta?",
o:["O açúcar mascavo possui coloração mais escura e sabor característico, podendo influenciar a cor, o sabor e a umidade das preparações.","O açúcar de confeiteiro apresenta cristais muito maiores que os do açúcar cristal.","A glucose de milho é utilizada somente para aumentar a doçura, sem exercer outras funções nas preparações.","O mel não interfere nas características sensoriais dos alimentos.","Os edulcorantes possuem exatamente as mesmas propriedades tecnológicas do açúcar em qualquer receita."],a:0,
e:["Certo. O mascavo é mais escuro, tem sabor marcante e mais umidade, e isso muda a cor, o sabor e a umidade da preparação.","O açúcar de confeiteiro é muito fino, com partículas bem menores que as do açúcar cristal.","A glucose de milho também influencia textura, brilho e umidade, além da doçura.","O mel interfere em sabor, cor e umidade e muda características sensoriais das preparações.","Edulcorantes adoçam, mas não têm o mesmo efeito do açúcar em volume, textura, cor e umidade."]},
{t:"Cálculo do fator de correção",q:"Uma abóbora pesou 1.200 g com casca e partes descartáveis. Depois da limpeza, restaram 960 g aproveitáveis. Qual o fator de correção (FC = peso bruto ÷ peso líquido)?",
o:["0,60","0,80","1,00","1,25","1,50"],a:3,
e:["Com perdas, o bruto é maior que o líquido, então o FC não pode ficar abaixo de 1.","0,80 vem de 960 ÷ 1.200. Você dividiu líquido por bruto, e a fórmula é bruto ÷ líquido.","FC 1,00 significaria sem nenhuma perda.","Certo. FC = 1.200 ÷ 960 = 1,25. Para obter 1 kg limpo é preciso comprar cerca de 1,25 kg.","FC 1,50 daria 1.440 g de peso bruto para os mesmos 960 g limpos."]},
{t:"Branqueamento",q:"Antes de congelar uma hortaliça, ela é submetida rapidamente ao calor e depois resfriada. Qual a principal finalidade?",
o:["Promover o cozimento completo da hortaliça.","Retirar toda a água presente no alimento.","Inativar enzimas responsáveis por alterações indesejáveis durante o armazenamento.","Esterilizar completamente o alimento.","Aumentar a quantidade de fibras alimentares."],a:2,
e:["O branqueamento é rápido e não cozinha a hortaliça por completo.","Ele não retira a água do alimento.","Certo. O calor rápido inativa enzimas que causariam alterações de cor, sabor e textura durante o armazenamento.","O branqueamento não esteriliza. Reduz parte dos microrganismos, mas não elimina todos.","Não altera a quantidade de fibras."]}
];
var VF=[
{t:"V ou F: higiene e contaminação cruzada",s:[
["Utensílios utilizados em alimentos crus podem transmitir microrganismos para alimentos prontos caso não sejam adequadamente higienizados.",1,"Sem higienização, o utensílio leva os microrganismos do cru para o pronto."],
["A contaminação cruzada pode ocorrer entre alimentos crus e alimentos prontos para o consumo.",1,"É exatamente esse o caminho típico da contaminação cruzada."],
["A refrigeração elimina todos os microrganismos presentes nos alimentos.",0,"A refrigeração só retarda a multiplicação. Não elimina microrganismos."],
["É importante higienizar superfícies e equipamentos utilizados durante a manipulação dos alimentos.",1,"Superfícies e equipamentos mal higienizados espalham microrganismos."],
["Alimentos que apresentam aparência normal estão necessariamente livres de microrganismos causadores de doenças.",0,"Muitos patogênicos não alteram aparência, cheiro nem sabor."]]},
{t:"V ou F: fator de correção",s:[
["O fator de correção relaciona o peso bruto do alimento ao seu peso líquido.",1,"FC = peso bruto ÷ peso líquido."],
["Quanto maior for a perda durante o pré-preparo, maior poderá ser o fator de correção.",1,"Mais perda significa mais peso bruto para o mesmo líquido, então o FC sobe."],
["O fator de correção pode auxiliar na estimativa da quantidade de alimento que deverá ser adquirida.",1,"Multiplica-se o peso líquido necessário pelo FC para saber quanto comprar."],
["O fator de correção é calculado dividindo-se o peso líquido pelo peso bruto.",0,"A divisão está invertida. O correto é peso bruto ÷ peso líquido."],
["Cascas, sementes, talos e partes inadequadas podem contribuir para as perdas consideradas no fator de correção.",1,"Essas partes descartadas compõem a diferença entre bruto e líquido."]]},
{t:"V ou F: índice de cocção",s:[
["O índice de cocção pode ser calculado dividindo o peso do alimento cozido pelo peso do alimento cru.",1,"IC = peso cozido ÷ peso cru."],
["Um alimento que absorve água durante a cocção pode apresentar aumento de peso.",1,"É o que acontece com o arroz e o feijão, por exemplo."],
["Se um alimento apresenta 500 g antes da cocção e 1.000 g depois, seu índice de cocção é 2,0.",1,"1.000 ÷ 500 = 2,0."],
["O índice de cocção é utilizado exclusivamente para avaliar o preço dos alimentos.",0,"Ele serve para rendimento e planejamento de quantidades, não só para preço."],
["Diferentes métodos de cocção podem influenciar o rendimento final de uma preparação.",1,"Cada método muda a perda ou o ganho de água e gordura, e com isso o rendimento."]]},
{t:"V ou F: métodos de conservação",s:[
["O congelamento é um método utilizado para aumentar a conservação de diversos alimentos.",1,"O frio intenso retarda a multiplicação de microrganismos e as reações no alimento."],
["A pasteurização utiliza tratamento térmico controlado.",1,"É calor em temperatura e tempo controlados."],
["A desidratação reduz a quantidade de água disponível no alimento.",1,"Menos água livre dificulta o crescimento de microrganismos."],
["Todos os métodos de conservação eliminam completamente qualquer possibilidade de deterioração.",0,"Os métodos retardam as alterações. Nenhum elimina por completo a possibilidade de deterioração."],
["A escolha do método de conservação deve considerar as características do alimento e o objetivo do processamento.",1,"Cada alimento reage de um jeito a cada método."]]},
{t:"V ou F: técnica dietética",s:[
["O corte dos alimentos é considerado um método de divisão.",1,"Cortar, triturar e peneirar são operações de divisão."],
["A mistura de ingredientes pode ser considerada um método de união.",1,"Misturar, bater e emulsionar são operações de união."],
["O branqueamento pode ser utilizado como pré-tratamento antes do congelamento de alguns vegetais.",1,"Ele inativa enzimas que alterariam o vegetal no armazenamento."],
["O açúcar pode contribuir apenas para o sabor doce, não interferindo em outras características das preparações.",0,"O açúcar também influencia cor, textura, umidade e volume."],
["Diferentes tipos de açúcares podem apresentar características distintas de cor, sabor, textura e aplicação culinária.",1,"Mascavo, cristal e confeiteiro, por exemplo, se comportam de formas diferentes."]]}
];
var DISC={t:"Questão discursiva",q:["Qual método foi escolhido? (congelamento, pasteurização, desidratação, secagem ou aditivos)","Cite um alimento que pode utilizar esse método.","Explique, de maneira resumida, como o método é realizado.","Qual é sua principal finalidade?","Cite uma vantagem desse método.","Apresente uma possível limitação ou cuidado relacionado à sua utilização."],
ex:["Congelamento rápido.","Carnes, peixes, frutas e hortaliças (como o brócolis, depois do branqueamento).","O alimento limpo e embalado é exposto rapidamente a temperaturas muito baixas e depois fica armazenado congelado, em geral a -18 °C ou menos.","Retardar a multiplicação dos microrganismos e as reações que estragam o alimento, aumentando a conservação.","Conserva por bastante tempo e mantém melhor a textura, a cor e o sabor, porque forma cristais de gelo pequenos que machucam pouco as células.","Não elimina os microrganismos, que voltam a se multiplicar quando o alimento descongela. Também exige manter o frio sem interrupção, e o alimento descongelado não deve ser congelado de novo."]};


var PV=[
{n:4,t:"Planejamento de quantidade",q:"Para um almoço coletivo, estima-se que cada pessoa consuma cerca de 150 g de purê de batata. Sabendo que o almoço será servido para 40 pessoas, qual será a quantidade total de purê necessária?",
o:["7 kg","8 kg","5 kg","4 kg","6 kg"],a:4,
e:["7 kg daria 175 g por pessoa, mais que o estimado.","8 kg daria 200 g por pessoa, mais que o estimado.","5 kg daria 125 g por pessoa, menos que o estimado.","4 kg daria só 100 g por pessoa.","Certo. 150 g × 40 pessoas = 6.000 g = 6 kg."]},
{n:5,t:"Açúcares, mel, glucose e edulcorantes",q:"Considerando as características dos açúcares, do mel, da glucose de milho e dos edulcorantes, assinale a alternativa correta.",
o:["O açúcar mascavo possui coloração mais escura e sabor característico, podendo contribuir para a cor, o sabor e a umidade das preparações.","Os edulcorantes apresentam as mesmas funções tecnológicas do açúcar, podendo substituí-lo integralmente em qualquer preparação sem alterar suas características.","O açúcar de confeiteiro apresenta cristais maiores que os do açúcar refinado, sendo indicado principalmente para preparações que necessitam de maior crocância.","O açúcar refinado é formado por cristais grandes e é utilizado principalmente para proporcionar textura crocante às preparações.","A glucose de milho tem como única função adoçar os alimentos, não interferindo na textura ou na conservação das preparações."],a:0,
e:["Certo. O mascavo é mais escuro, tem sabor marcante e mais umidade, e isso muda a cor, o sabor e a umidade da preparação.","Edulcorantes adoçam, mas não têm as mesmas funções do açúcar em volume, textura, cor e umidade. Não substituem o açúcar em qualquer receita sem mudar o resultado.","O açúcar de confeiteiro é muito fino, com partículas menores que as do refinado, e não serve para dar crocância.","O açúcar refinado tem cristais pequenos. Os cristais maiores são do açúcar cristal.","A glucose de milho também influencia a textura e a conservação (evita a cristalização e retém umidade), além de adoçar."]},
{n:6,t:"Índice de cocção do feijão",q:"Uma equipe pesou 250 g de feijão cru antes do cozimento. Depois da cocção, o alimento pesou 750 g. Sabendo que IC = peso cozido ÷ peso cru, qual é o índice de cocção e como ele se classifica quanto à variação de peso?",
o:["IC = 0,33 — alimento que apresentou redução de peso após a cocção.","IC = 2,0 — alimento que dobrou de peso após a cocção.","IC = 1,5 — alimento que apresentou pequeno aumento de peso.","IC = 4,0 — alimento que quadruplicou de peso durante a cocção.","IC = 3,0 — alimento que apresentou aumento de peso devido à absorção de água durante a cocção."],a:4,
e:["0,33 vem de 250 ÷ 750, a divisão invertida. E o feijão ganhou peso, não perdeu.","IC 2,0 daria 500 g de feijão cozido.","IC 1,5 daria 375 g de feijão cozido.","IC 4,0 daria 1.000 g de feijão cozido.","Certo. IC = 750 ÷ 250 = 3,0. O feijão triplicou de peso, principalmente por absorver água na cocção."]},
{n:7,t:"Branqueamento",q:"Antes do congelamento de algumas hortaliças, é comum expor o alimento ao calor por um curto período, seguido de resfriamento rápido. Qual é a principal finalidade do branqueamento?",
o:["Retirar a maior parte da água do alimento para aumentar sua concentração e durabilidade.","Eliminar completamente todos os microrganismos presentes no alimento, tornando-o totalmente seguro para o consumo.","Aumentar o valor nutricional do alimento por meio da eliminação das fibras durante o aquecimento.","Inativar enzimas que podem provocar alterações indesejáveis na cor, no sabor, no aroma e na textura do alimento.","Cozinhar completamente o alimento, eliminando a necessidade de outras etapas de preparo."],a:3,
e:["O branqueamento não serve para tirar a água. Quem reduz a água do alimento é a desidratação.","Ele não esteriliza. Reduz parte dos microrganismos, mas não elimina todos.","Não aumenta o valor nutricional nem elimina fibras.","Certo. O calor rápido inativa as enzimas que causariam mudanças de cor, sabor, aroma e textura durante o armazenamento.","É um pré-tratamento curto, não um cozimento completo. O alimento ainda passa por outras etapas."]},
{n:8,t:"Contaminação cruzada",q:"Um funcionário termina de preparar carne crua e, logo depois, monta uma salada que será servida sem cozimento, usando os mesmos utensílios e a mesma superfície, sem higienização adequada. Para garantir a segurança dos alimentos, qual procedimento deve ser adotado?",
o:["Lavar rapidamente os alimentos prontos para consumo após o preparo.","Higienizar adequadamente utensílios e superfícies antes de utilizá-los com alimentos prontos para consumo, evitando o contato entre alimentos crus e preparados.","Utilizar os mesmos utensílios entre alimentos crus e preparados somente após o término da higienização da cozinha.","Misturar os alimentos crus e preparados, desde que a salada seja mantida refrigerada.","Utilizar os mesmos utensílios, pois a refrigeração impede a multiplicação de microrganismos."],a:1,
e:["Lavar o alimento pronto depois não resolve. A contaminação vem do utensílio e da superfície, e a salada não vai ser cozida.","Certo. Utensílios e superfícies precisam ser higienizados antes de tocar o alimento pronto, mantendo cru e pronto separados.","Usar os mesmos utensílios entre o cru e o pronto continua causando contaminação cruzada. O que importa é higienizar antes de usá-los no alimento pronto.","Misturar cru com pronto é justamente a contaminação cruzada, e a refrigeração só retarda a multiplicação.","A refrigeração retarda a multiplicação, não impede nem elimina microrganismos, e não corrige utensílio contaminado."]},
{n:9,t:"Fator de correção na compra",q:"Uma UAN precisa obter 1 kg de batata descascada e pronta para o preparo. Sabendo que o fator de correção da batata é 1,25, qual quantidade de batata deve ser adquirida?",
o:["1.000 g","1.125 g","1.250 g","1.500 g","800 g"],a:2,
e:["1.000 g é o peso já limpo (líquido). Falta somar as perdas do descascamento.","1.125 g não resulta de 1.000 × 1,25.","Certo. Peso bruto = peso líquido × FC = 1.000 × 1,25 = 1.250 g.","1.500 g corresponderia a um FC de 1,50.","800 g vem de 1.000 ÷ 1,25. Você dividiu em vez de multiplicar, e o bruto tem de ser maior que o líquido."]},
{n:10,t:"Divisão e união dos alimentos",q:"Considerando os métodos de divisão e união dos alimentos, assinale a alternativa que apresenta, respectivamente, um exemplo de cada método.",
o:["Misturar os ingredientes de uma massa e, em seguida, bater um creme.","Emulsionar um molho e, em seguida, triturar uma fruta.","Bater os ingredientes de um creme e, em seguida, ralar uma cenoura.","Emulsionar uma preparação e, em seguida, cortar os ingredientes em pedaços.","Picar uma cebola e, em seguida, misturar os ingredientes de um molho."],a:4,
e:["Misturar e bater são as duas operações de união. Falta a divisão.","Emulsionar é união e triturar é divisão. A ordem pedida (divisão e depois união) está invertida.","Bater é união e ralar é divisão. A ordem está invertida.","Emulsionar é união e cortar é divisão. A ordem está invertida.","Certo. Picar é divisão e misturar é união, na ordem pedida."]}
];
var PD=[
{n:1,q:"Durante o acompanhamento das atividades de uma UAN, uma nutricionista identificou que alguns procedimentos de higiene não estavam sendo realizados corretamente e que havia diferenças na quantidade de alimentos utilizados e no rendimento das preparações. Explique por que o conhecimento sobre higiene dos alimentos e sobre indicadores como fator de correção, índice de cocção e rendimento é importante para a atuação do nutricionista em uma UAN. Relacione esses conhecimentos à prevenção da contaminação, ao controle de custos, à redução de desperdícios e à qualidade das refeições.",
ex:"A higiene previne a contaminação dos alimentos, como a contaminação cruzada, e protege a saúde do consumidor e a qualidade da refeição. O fator de correção mostra quanto alimento comprar para chegar ao peso limpo, o índice de cocção mostra o ganho ou a perda de peso na cocção e o rendimento ajuda a prever quantas porções saem. Com esses indicadores o nutricionista planeja as quantidades certas, evita comprar demais ou faltar comida, reduz o desperdício e controla os custos. Quando a higiene falha e os indicadores não são usados, aparecem diferenças na quantidade usada e no rendimento, e a refeição pode ficar com menos qualidade ou insegura."},
{n:2,q:"Escolha um dos métodos (congelamento, pasteurização, desidratação, secagem ou aditivos alimentares) e responda: 1. Qual método você escolheu? 2. Qual alimento pode ser submetido a esse método? 3. Como o método é realizado e quais alterações ele provoca no alimento? 4. Qual é a finalidade do método e de que maneira ele contribui para aumentar a conservação, a qualidade e a segurança do alimento? 5. Cite uma vantagem e uma possível limitação do método escolhido.",
ex:"1. Congelamento rápido. 2. Carnes, peixes, frutas e hortaliças, como o brócolis depois do branqueamento. 3. O alimento limpo e embalado é exposto rapidamente a temperaturas muito baixas e fica armazenado congelado, em geral a -18 °C ou menos. A água vira cristais de gelo pequenos, que machucam pouco as células, então a textura, a cor e o sabor mudam pouco. Pode haver pequena perda de água ao descongelar. 4. Retardar a multiplicação dos microrganismos e as reações químicas e enzimáticas que estragam o alimento, aumentando a conservação e mantendo qualidade e segurança. 5. Vantagem: conserva por muito mais tempo e mantém boa parte do valor nutricional e das características sensoriais. Limitação: não elimina microrganismos (eles voltam a se multiplicar ao descongelar), exige manter o frio sem interrupção e o alimento descongelado não deve ser congelado de novo."},
{n:3,q:"Para fazer uma sopa, a equipe precisa de 600 g de batata limpa e pronta para o cozimento. Depois do descascamento e da retirada das partes inadequadas, verificou-se que foram usados 750 g de batata in natura para obter os 600 g necessários. Calcule o fator de correção (FC) da batata e explique o que esse resultado representa para o planejamento da quantidade de alimento que deverá ser adquirida.",
ex:"FC = peso bruto ÷ peso líquido = 750 ÷ 600 = 1,25. Isso quer dizer que, para cada 1 kg de batata limpa, é preciso comprar 1,25 kg in natura, porque 25% é perdido em casca e partes inadequadas. No planejamento da compra, multiplica-se a quantidade líquida necessária pelo FC."}
];
function disc3(l){PD.forEach(function(q){var d=el('div','q');d.appendChild(el('span','tag','Q.'+q.n+' · discursiva (não entra na porcentagem)'));d.appendChild(el('p','',q.q));
var ta=document.createElement('textarea');ta.placeholder='Escreva sua resposta';d.appendChild(ta);
var b=el('button','btn','Ver exemplo de resposta');var x=el('div');b.onclick=function(){b.remove();x.className='fb good';x.textContent=q.ex};d.appendChild(b);d.appendChild(x);l.appendChild(d)})}
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
var LS='tecdiet_v1',D={};
try{D=JSON.parse(localStorage.getItem(LS))||{}}catch(e){D={}}
function save(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
var LS2='tecdiet_days',H={};
try{H=JSON.parse(localStorage.getItem(LS2))||{}}catch(e){H={}}
function saveH(){try{localStorage.setItem(LS2,JSON.stringify(H))}catch(e){}}
function dk(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function rec(id,ok){var r=D[id]||(D[id]={c:0,w:0});if(ok)r.c++;else r.w++;save();
var k=dk(new Date()),x=H[k]||(H[k]={c:0,w:0});if(ok)x.c++;else{x.w++;(x.e=x.e||[]).push(id)}saveH()}
var rng=7;

// grupos e itens
var G=[{id:'mc',t:'Múltipla escolha',sub:'10 questões com cálculos, higiene e conservação',items:MC.map(function(q,i){return{id:'m'+i,l:(i+1)+'. '+q.t}})}];
VF.forEach(function(g,gi){G.push({id:'v'+gi,t:g.t,sub:'5 afirmações',items:g.s.map(function(s,j){return{id:'v'+gi+'_'+j,l:s[0]}})})});
G.unshift({id:'pv',t:'Prova técnica e dietética',sub:'10 questões da prova: 7 objetivas e 3 discursivas',items:PV.map(function(q,i){return{id:'p'+i,l:'Q.'+q.n+' '+q.t}})});
function stat(g){var c=0,w=0;g.items.forEach(function(it){var r=D[it.id];if(r){c+=r.c;w+=r.w}});return{c:c,w:w}}
function pct(s){var t=s.c+s.w;return t?Math.round(100*s.c/t):0}

// home
function cards(){var h=$('cards');h.innerHTML='';
G.concat([{id:'disc',t:DISC.t,sub:'Escolha um método e responda 6 itens (não entra na porcentagem)',items:[]}]).forEach(function(g){
var s=stat(g),t=s.c+s.w;var b=el('button','card');var d=el('div');d.appendChild(el('b','',g.t));
d.appendChild(el('span','',g.sub+(t?' · '+pct(s)+'% de acerto ('+s.c+' certas, '+s.w+' erradas)':'')));
b.appendChild(d);b.appendChild(el('em','','›'));b.onclick=function(){open_(g)};h.appendChild(b)})}
var cur,run;
function open_(g){cur=g;$('home').style.display='none';$('run').style.display='block';$('rt').textContent=g.t;build();window.scrollTo(0,0)}
function back(){$('run').style.display='none';$('home').style.display='block';cards();window.scrollTo(0,0)}
function fb(box,ok,html){box.className='fb '+(ok?'good':'bad');box.innerHTML='';html.forEach(function(p){var d=el('div');if(p[0]){d.appendChild(el('b','',p[0]))}d.appendChild(document.createTextNode(p[1]));box.appendChild(d)})}
function upd(){var t=run.c+run.w,tot=cur.items.length,a=stat({items:G.reduce(function(x,g){return x.concat(g.items)},[])});
$('score').textContent='Nesta rodada: '+run.c+' certas, '+run.w+' erradas ('+t+'/'+tot+') · Geral: '+pct(a)+'%'}
function build(){var l=$('rl');l.innerHTML='';run={c:0,w:0};$('score').style.display='block';
if(cur.id==='disc'){$('score').style.display='none';
DISC.q.forEach(function(q,i){var d=el('div','q');d.appendChild(el('p','',(i+1)+'. '+q));var ta=document.createElement('textarea');ta.placeholder='Escreva sua resposta';d.appendChild(ta);
var b=el('button','btn','Ver exemplo');var x=el('div');b.onclick=function(){b.remove();x.className='fb good';x.textContent='Exemplo (congelamento rápido): '+DISC.ex[i]};d.appendChild(b);d.appendChild(x);l.appendChild(d)});return}
if(cur.id==='mc'||cur.id==='pv'){var P=cur.id==='pv',AR=P?PV:MC;if(P)disc3(l);AR.forEach(function(q,i){var d=el('div','q');d.appendChild(el('span','tag',P?'Q.'+q.n:'Questão '+(i+1)));d.appendChild(el('p','',q.q));var box=el('div');
var bs=[];q.o.forEach(function(o,k){var b=el('button','o','ABCDE'[k]+') '+o);bs.push(b);b.onclick=function(){
bs.forEach(function(x){x.disabled=true});var ok=k===q.a;bs[q.a].classList.add('right');if(!ok)b.classList.add('wrong');
rec((P?'p':'m')+i,ok);if(ok)run.c++;else run.w++;
fb(box,ok,ok?[['Correto.',q.e[q.a]]]:[['Errou. A correta é a '+'ABCDE'[q.a]+'.',''],['Por que a '+'ABCDE'[k]+' está errada: ',q.e[k]],['Por que a '+'ABCDE'[q.a]+' está certa: ',q.e[q.a]]]);upd()};d.appendChild(b)});
d.appendChild(box);l.appendChild(d)})}
else{var gi=+cur.id.slice(1);VF[gi].s.forEach(function(s,j){var d=el('div','q');d.appendChild(el('span','tag','Afirmação '+(j+1)));d.appendChild(el('p','',s[0]));var box=el('div');
var w=el('div','vf'),bs=[];[['Verdadeiro',1],['Falso',0]].forEach(function(v){var b=el('button','o',v[0]);bs.push(b);b.onclick=function(){
bs.forEach(function(x){x.disabled=true});var ok=v[1]===s[1];bs[s[1]?0:1].classList.add('right');if(!ok)b.classList.add('wrong');
rec('v'+gi+'_'+j,ok);if(ok)run.c++;else run.w++;
fb(box,ok,ok?[['Correto.',s[2]]]:[['Errou. A afirmação é '+(s[1]?'verdadeira':'falsa')+'.',s[2]]]);upd()};w.appendChild(b)});
d.appendChild(w);d.appendChild(box);l.appendChild(d)})}
upd()}
$('back').onclick=back;$('redo').onclick=function(){build();window.scrollTo(0,0)};

// progresso
function donut(c,w){var t=c+w,p=t?c/t:0,L=2*Math.PI*54;
return '<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Acertos '+Math.round(p*100)+'%"><circle cx="70" cy="70" r="54" fill="none" stroke="'+(t?'var(--bad)':'var(--line)')+'" stroke-width="16"/><circle cx="70" cy="70" r="54" fill="none" stroke="var(--ok)" stroke-width="16" stroke-dasharray="'+(p*L)+' '+L+'" transform="rotate(-90 70 70)"/><text x="70" y="77" text-anchor="middle" font-size="24" font-weight="600" fill="currentColor">'+(t?Math.round(p*100)+'%':'—')+'</text></svg>'}
var LB=null;function lb(){if(!LB){LB={};G.forEach(function(g){g.items.forEach(function(it){LB[it.id]={l:it.l,g:g.t}})})}return LB}
function showErr(p,cnt,title){var ks=Object.keys(cnt);p.style.display='block';p.innerHTML='';p.appendChild(el('b','',title));
if(!ks.length){p.appendChild(el('p','','Nenhum erro registrado.'));return}
var u=el('ul','w');ks.sort(function(a,b){return cnt[b]-cnt[a]}).forEach(function(k){var m=lb()[k]||{l:k,g:''},li=el('li');li.appendChild(el('b','',m.g+': '));li.appendChild(document.createTextNode(m.l+' — errou '+cnt[k]+(cnt[k]>1?' vezes':' vez')));u.appendChild(li)});p.appendChild(u)}
var zr=false;
function prog(){var all=[];G.forEach(function(g){all=all.concat(g.items)});var s=stat({items:all}),t=s.c+s.w,h=$('pg');
var html='<h2>Seu progresso</h2>';
if(!t){html+='<p class="intro">Você ainda não respondeu nenhuma questão. Faça um conjunto na aba Questões e o gráfico aparece aqui.</p>'}
else{html+='<div class="sum">'+donut(s.c,s.w)+'<div class="leg"><div><span class="dot" style="background:var(--ok)"></span><b>'+s.c+'</b> acertos ('+pct(s)+'%)</div><button class="lg" id="eb"><span class="dot" style="background:var(--bad)"></span><b>'+s.w+'</b> erros ('+(100-pct(s))+'%) <u>ver quais</u></button><div style="color:var(--mute);font-size:14px">'+t+' respostas no total. O histórico é acumulado e não zera quando você refaz.</div></div></div><div class="ep" id="ep" style="display:none"></div>';
html+='<h2>Por dia</h2><div class="rng">';
[7,14,30].forEach(function(n){html+='<button class="chip'+(n===rng?' on':'')+'" data-n="'+n+'">'+n+' dias</button>'});
html+='</div><div class="days" id="days">';
for(var i=rng-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var x=H[dk(d)]||{c:0,w:0},n=x.c+x.w,pc=n?Math.round(100*x.c/n):0;
html+='<div class="dc" data-k="'+dk(d)+'" role="button" tabindex="0"><div class="dp">'+(n?pc+'%':'')+'</div><div class="db"><div class="de" style="height:'+(n?100-pc:0)+'%"></div><div class="dk" style="height:'+pc+'%"></div></div><div class="dl">'+(i===0?'hoje':('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2))+'</div><div class="dn">'+(n?x.c+' · '+x.w:'')+'</div></div>'}
html+='</div><div class="ep" id="dpn" style="display:none"></div><p class="note">Toque em um dia para ver os erros dele. Verde é acerto e vermelho é erro, em % do dia. Embaixo de cada dia: acertos · erros.'+(Object.keys(H).length?'':' O gráfico por dia começa a contar a partir de agora, e o que você respondeu antes entra só no total.')+'</p>';
html+='<h2>Por conjunto</h2>';
G.forEach(function(g){var x=stat(g),n=x.c+x.w;html+='<div class="bar"><div class="bl"><span>'+g.t+'</span><span>'+(n?pct(x)+'% · '+x.c+' certas · '+x.w+' erradas':'sem respostas')+'</span></div><div class="tr'+(n?' has':'')+'"><div class="fl" style="width:'+(n?pct(x):0)+'%"></div></div></div>'});
var er=all.filter(function(it){return D[it.id]&&D[it.id].w>0}).sort(function(a,b){return D[b.id].w-D[a.id].w}).slice(0,5);
if(er.length){html+='<h2>Onde você mais errou</h2><ul class="w" id="ew"></ul>'}}
h.innerHTML=html;
document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){rng=+c.dataset.n;prog()}});
if($('days'))$('days').scrollLeft=1e5;
if($('eb'))$('eb').onclick=function(){var p=$('ep');if(p.style.display==='block'){p.style.display='none';return}var c={};Object.keys(D).forEach(function(k){if(D[k].w>0)c[k]=D[k].w});showErr(p,c,'Questões que você errou')};
document.querySelectorAll('.dc').forEach(function(c){c.onclick=function(){var k=c.dataset.k,x=H[k]||{c:0,w:0},p=$('dpn'),t=k.split('-'),ti='Erros de '+t[2]+'/'+t[1],cnt={};
if(!x.w){p.style.display='block';p.innerHTML='';p.appendChild(el('b','',ti));p.appendChild(el('p','',x.c?'Nenhum erro neste dia.':'Sem respostas neste dia.'));return}
if(!x.e){p.style.display='block';p.innerHTML='';p.appendChild(el('b','',ti));p.appendChild(el('p','','Este dia teve '+x.w+' erro(s), mas foi registrado antes de eu guardar quais foram.'));return}
x.e.forEach(function(i){cnt[i]=(cnt[i]||0)+1});showErr(p,cnt,ti)}});
if($('ew'))er.forEach(function(it){var r=D[it.id];$('ew').appendChild(el('li','',it.l+' — errou '+r.w+' de '+(r.c+r.w)+' vezes'))});
if(t){var b=el('button','btn out',zr?'Tem certeza? Clique de novo para apagar':'Limpar histórico');b.onclick=function(){if(zr){D={};save();H={};saveH();zr=false;prog()}else{zr=true;prog()}};h.appendChild(b)}}

document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){
document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id===b.dataset.v)});
zr=false;if(b.dataset.v==='pro')prog();else back();window.scrollTo(0,0)}});
cards();
</script>
